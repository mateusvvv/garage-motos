<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peças & Acessórios | Garage Motos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="text-white font-['Inter'] bg-neutral-950">

    <!-- Header Simples -->
    <nav class="fixed w-full z-50 bg-black/90 backdrop-blur-md border-b border-red-600/30 px-4 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="Garage Motos" class="h-12 w-auto object-contain">
            </a>
            <a href="index.html" class="bg-neutral-800 px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-widest hover:bg-red-600 transition">Voltar para o Início</a>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-4 md:px-6 max-w-7xl mx-auto min-h-screen">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-6xl font-black uppercase italic mb-4">Peças & <span class="text-red-600">Acessórios</span></h1>
            <p class="text-neutral-500 uppercase tracking-[0.3em] text-xs">Catálogo Completo Garage Motos</p>
        </div>

        <!-- Grid de Produtos Completo -->
        <div id="full-shop-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-8">
            <!-- Itens injetados via JS -->
        </div>

        <!-- Mensagem de Rodapé -->
        <div class="mt-24 text-center border-t border-neutral-800 pt-12">
            <p class="text-neutral-500 text-[10px] uppercase tracking-widest">Não encontrou o que procurava?</p>
            <a href="https://api.whatsapp.com/send?phone=558193735372" target="_blank" class="text-red-600 font-bold hover:underline block mt-2">Fale com a gente no WhatsApp</a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
